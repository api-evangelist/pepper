name: Pepper
description: >-
  Pepper is an AI-first operating platform for independent food and beverage distributors,
  helping them compete with larger enterprises through automation and digital tooling. Its
  product suite spans a B2C-style Storefront for operator ordering, an AI Order Agent that
  captures orders across voice, text, image, and handwriting, a Sales Hub for reps, a
  Marketing Hub for direct-to-operator advertising, and a Finance Hub for payments and
  collections. Pepper integrates with 70+ ERP systems and serves broadline, produce,
  seafood, meat, JanSan, convenience, coffee, alcohol, and ice cream distribution. The
  company is backed by Greylock, ICONIQ Capital, and Index Ventures. Pepper does not
  currently publish a public API or developer portal; this profile captures its public
  company and security surface.
